name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Only the light core + dev tools: the domain, tracking and pipeline
        # layers are deliberately free of the CUDA/ultralytics stack, so CI
        # stays fast and does not need GPU wheels.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install scipy scikit-learn

      - name: Lint (ruff)
        run: ruff check vtracker

      - name: Type check (mypy)
        run: mypy vtracker

      - name: Tests (pytest)
        run: pytest vtracker/tests
