[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtracker"
version = "0.2.0"
description = "Volleyball match tracking pipeline (ball, players, referees) with court/net projection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core runtime. The heavy CV/ML stack lives in the `full` extra so the domain
# and tracking layers (and their tests) can be installed without CUDA wheels.
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
full = [
    "ultralytics>=8.1,<9",
    "deep-sort-realtime>=1.3,<2",
    "supervision>=0.18,<1",
    "scikit-learn>=1.3,<2",
    "torch>=2.0",
    "scipy>=1.10,<2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
vtracker = "vtracker.app:main"
vtracker-field-marker = "vtracker.tools.field_marker:main"

[tool.setuptools.packages.find]
include = ["vtracker*"]

[tool.pytest.ini_options]
testpaths = ["vtracker/tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "B008",  # function call in default argument — not a pattern used here
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"vtracker/tests/*" = ["B011"]  # asserts are the point in tests

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# The CV/ML stack ships incomplete or missing stubs; don't fail on them.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vtracker.tests.*"]
disallow_untyped_defs = false
